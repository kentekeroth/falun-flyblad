<!DOCTYPE html>
<html lang="sv">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Flyblad Falun</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
  <link rel="stylesheet" href="style.css">
</head>
<body>

<!-- Login overlay -->
<div id="login-overlay">
  <div class="login-card">
    <h1>Flyblad Falun</h1>
    <p id="login-desc">Ange ditt namn för att logga in och börja markera utdelade gator.</p>
    <div id="user-list" class="user-list" hidden></div>
    <form id="login-form">
      <input id="name-input" type="text" placeholder="Ditt namn" autocomplete="name" maxlength="40" required>
      <input id="pin-input" type="password" placeholder="PIN (bara för adminkontot)" autocomplete="off" maxlength="20">
      <p id="login-error" class="login-error" hidden></p>
      <button type="submit">Logga in</button>
    </form>
  </div>
</div>

<!-- App shell -->
<header>
  <span class="app-title">Flyblad Falun</span>

  <div class="round-controls">
    <select id="round-select">
      <option value="">— Välj omgång —</option>
    </select>
    <button id="new-round-btn" hidden>+ Ny omgång</button>
    <button id="delete-round-btn" hidden title="Ta bort vald omgång">🗑</button>
    <button id="post-btn" title="Markera ett område som postutdelat">Post</button>
    <button id="freehand-btn" title="Rita ett område fritt för att markera gator som utdelade">Rita</button>
  </div>

  <div class="user-info">
    <span id="streets-status"></span>
    <span>Inloggad: <strong id="user-label"></strong>
      <span id="my-color-dot" class="color-dot"></span>
    </span>
    <button id="admin-btn" hidden>Hantera</button>
    <button id="logout-btn">Byt namn</button>
  </div>
</header>

<div id="admin-panel" hidden>
  <div class="admin-panel-inner">
    <strong class="admin-panel-title">Omgångar</strong>
    <div id="admin-round-list" class="admin-user-list"></div>
    <strong class="admin-panel-title" style="margin-top:10px">Hantera användare</strong>
    <div id="admin-user-list" class="admin-user-list"></div>
  </div>
</div>

<div class="map-wrap">
<div id="map"></div>

<!-- Draw panel -->
<div id="draw-panel" class="draw-panel" hidden>
  <span id="draw-hint">Rita ett område på kartan.</span>
  <div class="draw-actions">
    <button id="draw-finish-btn" onclick="drawFinishBtn()">Klar</button>
    <button id="draw-confirm-btn" class="draw-confirm-btn" hidden onclick="drawConfirm()">Markera som postutdelat</button>
    <button id="draw-unmark-btn" class="draw-unmark-btn" hidden onclick="drawUnmark()">Avmarkera hela området</button>
    <button id="draw-cancel-btn" onclick="cancelDraw()">Avbryt</button>
  </div>
  <div id="draw-leaflet-row" style="margin-top:6px;display:none">
    <label style="font-size:0.85em">Flygblad: <input id="draw-leaflet-input" placeholder="Ange flygblad…" style="padding:2px 4px;width:160px"></label>
  </div>
</div>
</div>

<footer>
  <div class="footer-top">
    <span id="progress-text">Välj en omgång för att se statistik</span>
    <button id="refresh-btn" title="Uppdatera">↻ Uppdatera</button>
  </div>
  <div id="progress-bar" class="progress-bar"><div class="progress-empty"></div></div>
  <div id="volunteer-legend" class="legend"></div>
  <div id="leaflet-indicator" class="leaflet-indicator">
    <span class="leaflet-label">Flygblad:</span>
    <span id="leaflet-display"></span>
    <button id="leaflet-edit-btn" onclick="leafletIndicatorEdit()"></button>
    <span id="leaflet-edit-form" hidden>
      <input id="leaflet-edit-input" onkeydown="if(event.key==='Enter')leafletIndicatorSave()" placeholder="Ange flygblad…">
      <button onclick="leafletIndicatorSave()">Spara</button>
      <button onclick="leafletIndicatorCancel()">Avbryt</button>
    </span>
  </div>
</footer>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="app.js"></script>
</body>
</html>
